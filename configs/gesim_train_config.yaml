
model_name: 'gesim_cosmos2_train'
seed: 42
mixed_precision: 'bf16'
allow_tf32: true

report_to: 'tensorboard'
tracker_name: 'gesim_trainer'
logging_dir: 'logs'

pretrained_model_name_or_path: 'PATH_TO_PRETRAINED_WEIGHTS_OF_VAE_AND_TOKENIZER'
tokenizer_pretrained_model_name_or_path: 'PATH_TO_PRETRAINED_WEIGHTS_OF_VAE_AND_TOKENIZER'

tokenizer_class_path: 'transformers'
tokenizer_class: 'T5TokenizerFast'
textenc_class_path: 'transformers'
textenc_class: 'T5EncoderModel'

vae_class_path: 'models/cosmos_models/models/autoencoders/autoencoder_kl_wan.py'
vae_class: 'AutoencoderKLWan'

diffusion_model_class_path: 'models/cosmos_models/models/transformers/transformer_cosmos_multiview.py'
diffusion_model_class: 'MultiViewCosmosTransformer3DModel'

diffusion_scheduler_class_path: 'models/pipeline/gesim_cosmos2_pipeline_utils/scheduling_flow_match_euler_discrete.py'
diffusion_scheduler_class: 'FlowMatchEulerDiscreteScheduler'

pipeline_class_path: 'models/pipeline/gesim_pipeline.py'
pipeline_class: 'GeSimCosmos2Pipeline'

return_action: false
return_video: true
action_loss_scale: 1.0
action_cond_mode: true

enable_slicing: true
enable_tiling: true

flow_weighting_scheme: 'none'
flow_logit_mean: 0.0
flow_logit_std: 1.0
flow_mode_scale: 1.29
pixel_wise_timestep: false

diffusion_model:
  model_path: 'LOCAL_PATH/TO/ge_sim_cosmos_v0.1.safetensors'
  config:
    in_channels: 26  # 16 (vae) + 3 (traj) + 6 (raymap) + 1 (padding mask)
    out_channels: 16
    num_attention_heads: 16
    attention_head_dim: 128
    num_layers: 28
    mlp_ratio: 4.0
    text_embed_dim: 1024
    adaln_lora_dim: 256
    max_size: [128, 240, 240]
    patch_size: [1, 2, 2]
    rope_scale: [1.0, 3.0, 3.0]
    concat_padding_mask: true
    extra_pos_embed_type: null
    use_view_embed: true
    action_expert: false
    action_in_channels: 7
    action_num_attention_heads: 16
    action_attention_head_dim: 32
    action_rope_dim: 32

data:
  train:
    data_roots: ['PATH_TO_YOUR_DATASET_ROOT']
    domains: ['agibotworld']
    task_info_root: 'PATH_TO_TASK_INFO_JSON_FILES'
    sample_size: [384, 512]  # [height, width]
    sample_n_frames: 360
    preprocess: 'resize'
    valid_cam: ['head', 'hand_left', 'hand_right']
    chunk: 25
    action_chunk: 25
    n_previous: 4
    stat_file: null

  val:
    data_roots: ['PATH_TO_YOUR_VALIDATION_DATASET_ROOT']
    domains: ['agibotworld']
    task_info_root: 'PATH_TO_VALIDATION_TASK_INFO_JSON_FILES'
    sample_size: [384, 512]
    sample_n_frames: 360
    preprocess: 'resize'
    valid_cam: ['head', 'hand_left', 'hand_right']
    chunk: 25
    action_chunk: 25
    n_previous: 4
    stat_file: null

train_epochs: 10
batch_size: 1
gradient_accumulation_steps: 8
dataloader_num_workers: 4

optimizer: 'AdamW'
lr: 1e-4
beta1: 0.9
beta2: 0.999
epsilon: 1e-8
weight_decay: 0.01
max_grad_norm: 1.0

lr_scheduler: 'cosine'
lr_warmup_steps: 500

save_steps: 1000
log_steps: 100
num_inference_step: 15

load_weights: true
load_diffusion_model_weights: true

diffusion_scheduler_args:
  num_train_timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: 'linear'
